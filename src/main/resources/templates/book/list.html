<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Book List</title>
</head>
<body>
    <h1>All Books List</h1>
    
    <table border="1">
        <thead>
            <tr>
                <th>ID</th>
                <th>Subject</th>
                <th>Author</th>
                <th>Publisher</th>
                <th>Category</th>
                <th>ISBN</th>
                <th>Price</th>
                <th>Created Date</th>
                <th>Description</th>
                <th>Action</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="book : ${books}">
                <td th:text="${book.id}"></td>
                <td th:text="${book.subject}"></td>
                <td th:text="${book.authorName}"></td>
                <td th:text="${book.publisher}"></td>
                <td th:text="${book.category}"></td>
                <td th:text="${book.ISBN}"></td>
                <td th:text="${book.price}"></td>
                <td th:text="${book.createdDate}"></td>
                <td th:text="${book.description}"></td>
                <td>
                    <form th:action="@{/book/add}" method="post" th:if="${!userBooks.contains(book)}">
                        <input type="hidden" name="bookId" th:value="${book.id}" />
                        <button type="submit">Add Book</button>
                    </form>
                </td>
            </tr>
        </tbody>
    </table>

    <h2 th:text="${session.user + '‘s Books'}"></h2>
    <div th:if="${#sets.isEmpty(userBooks)}">
        <p>You don't have any books yet.</p>
    </div>
    <div th:unless="${#sets.isEmpty(userBooks)}">
        <table border="1">
            <thead>
                <tr>
                    <th>Book ID</th>
                    <th>Subject</th>
                    <th>Author</th>
                    <th>Publisher</th>
                    <th>Category</th>
                    <th>Price</th>
                    <th>Created Date</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="book : ${userBooks}">
                    <td th:text="${book.id}"></td>
                    <td th:text="${book.subject}"></td>
                    <td th:text="${book.authorName}"></td>
                    <td th:text="${book.publisher}"></td>
                    <td th:text="${book.category}"></td>
                    <td th:text="${book.price}"></td>
                    <td th:text="${book.createdDate}"></td>
                </tr>
            </tbody>
        </table>
    </div>
    
    <p th:if="${#lists.isEmpty(books)}">No books found.</p>
    
    <br>
    <a href="/book/create">Add New Book</a>
    <br>
    <a href="/user/books">My Books</a>
    <br>
    <a href="/home">Back to Home</a>
</body>
</html>
