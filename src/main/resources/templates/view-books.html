<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Books</h1>
    <ul>
        <li th:each="book : ${books}">
            <a th:href="@{/view-book/{id}(id=${book.id})}">
                <span th:text="${book.title}"></span>
            </a>
        </li>
    </ul>
</body>
</html>
