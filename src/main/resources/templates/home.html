<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Home - Welcome</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; }
        .welcome-box { background-color: #f0f8ff; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .logout-btn { background-color: #dc3545; color: white; padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; }
        .logout-btn:hover { background-color: #c82333; }
    </style>
</head>
<body>
    <div class="welcome-box">
        <p>You have successfully logged in.</p>
        <p><strong>Username:</strong> <span th:text="${session.user}">Guest</span></p>
        <p><strong>Login Status:</strong> <span style="color: green;">✓ Active</span></p>
    </div>
    
    <h3>Quick Actions</h3>
    <ul>
        <!-- <li><a href="/register">Register New User</a></li>
        <li><a href="/test-db">Test Database Connection</a></li> -->
    </ul>
    
    <form action="/user/logout" method="get" style="margin-top: 30px;">
        <button type="submit" class="logout-btn">Logout</button>
    </form>
</body>
</html>
