<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Login</title>
    <style>
        body { 
            font-family: Arial, sans-serif; 
            margin: 0; 
            padding: 0; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
        }
        .login-container { 
            background: white; 
            padding: 40px; 
            border-radius: 10px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1); 
            width: 100%; 
            max-width: 400px; 
        }
        h2 { 
            text-align: center; 
            color: #333; 
            margin-bottom: 30px; 
            font-size: 28px; 
        }
        .form-group { 
            margin-bottom: 20px; 
        }
        label { 
            display: block; 
            margin-bottom: 5px; 
            color: #555; 
            font-weight: bold; 
        }
        input[type="text"], input[type="password"] { 
            width: 100%; 
            padding: 12px; 
            border: 2px solid #ddd; 
            border-radius: 5px; 
            font-size: 16px; 
            box-sizing: border-box; 
        }
        input[type="text"]:focus, input[type="password"]:focus { 
            outline: none; 
            border-color: #667eea; 
        }
        .login-btn { 
            width: 100%; 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            color: white; 
            padding: 12px; 
            border: none; 
            border-radius: 5px; 
            font-size: 16px; 
            cursor: pointer; 
            transition: transform 0.2s; 
        }
        .login-btn:hover { 
            transform: translateY(-2px); 
        }
        .error { 
            color: #e74c3c; 
            text-align: center; 
            margin-bottom: 20px; 
            padding: 10px; 
            background: #fdf2f2; 
            border-radius: 5px; 
            border: 1px solid #fad4d4; 
        }
        .success { 
            color: #27ae60; 
            text-align: center; 
            margin-bottom: 20px; 
            padding: 10px; 
            background: #f2fdf2; 
            border-radius: 5px; 
            border: 1px solid #d4fad4; 
        }
        .links { 
            text-align: center; 
            margin-top: 20px; 
        }
        .links a { 
            color: #667eea; 
            text-decoration: none; 
        }
        .links a:hover { 
            text-decoration: underline; 
        }
        .admin-badge {
            background: #e74c3c;
            color: white;
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 12px;
            position: absolute;
            top: 20px;
            right: 20px;
        }
    </style>
    <script th:inline="javascript">
        /*<![CDATA[*/
            // Show error message if present
            let error = /*[[${error}]]*/ null;
            if (error != null && error !== '') {
                // Error will be shown in the div below
            }
            
            // Show success message if present
            let success = /*[[${success}]]*/ null;
            if (success != null && success !== '') {
                // Success will be shown in the div below
            }
        /*]]>*/
    </script>
</head>
<body>
    <div class="admin-badge">ADMIN PANEL</div>
    
    <div class="login-container">
        <h2>🔐 Admin Login</h2>
        
        <div th:if="${error}" class="error">
            <p th:text="${error}"></p>
        </div>
        
        <div th:if="${success}" class="success">
            <p th:text="${success}"></p>
        </div>
        
        <form action="/admin/login" method="post">
            <div class="form-group">
                <label for="username">Username:</label>
                <input id="username" name="username" type="text" required>
            </div>
            
            <div class="form-group">
                <label for="password">Password:</label>
                <input id="password" name="password" type="password" required>
            </div>
            
            <button type="submit" class="login-btn">Login to Admin Panel</button>
        </form>
        
        <div class="links">
            <a href="/admin/register">Create Admin Account</a> | 
            <a href="/login">Regular User Login</a>
        </div>
    </div>
</body>
</html>
