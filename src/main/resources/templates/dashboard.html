<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard - Moderator Portal</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .header { background: #f8f9fa; padding: 20px; border-radius: 5px; margin-bottom: 20px; }
        .logout-btn { background: #dc3545; color: white; padding: 10px 20px; text-decoration: none; border-radius: 3px; }
    </style>
</head>
<body>
    <div class="header">
        <h1>Welcome, <span sec:authentication="name">Moderator</span>!</h1>
        <p>You are logged in as a moderator with admin privileges.</p>
        <form th:action="@{/logout}" method="post" style="display: inline;">
            <button type="submit" class="logout-btn">Logout</button>
        </form>
    </div>
    
    <div class="content">
        <h2>Moderator Dashboard</h2>
        <p>This is your admin dashboard. Add your administrative functions here.</p>
        
        <!-- Add your admin features here -->
        <div>
            <h3>Quick Actions</h3>
            <ul>
                <li>Manage content</li>
                <li>View user reports</li>
                <li>System settings</li>
            </ul>
        </div>
    </div>
</body>
</html>
