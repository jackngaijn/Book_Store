<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Moderator Portal</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .form-container { max-width: 400px; margin: 0 auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; }
        button { width: 100%; padding: 10px; background: #007bff; color: white; border: none; }
        .error { color: red; margin: 10px 0; }
        .success { color: green; margin: 10px 0; }
    </style>

<script>
    async function handleLogin(event) {
        event.preventDefault();
        // Collect form data
        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        // POST to your login API
        const response = await fetch("/moderator/login", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ username, password })
        });

        if(response.ok) {
            window.location.href = "/dashboard";
        } else {
            alert("Login failed: Invalid username or password");
        }
    }
</script>
</head>
<body>
    <div class="form-container">
        <h2>Moderator Login</h2>
        <form method="post" onsubmit="handleLogin(event)">
            <input type="text" id="username" name="username" placeholder="Username" required minlength="3"/>
            <input type="password" id="password" name="password" placeholder="Password" required minlength="6"/>
            <button type="submit">Login</button>
        </form>
        <p><a th:href="@{/register}">Don't have an account? Register here</a></p>
    </div>
</body>
</html>
