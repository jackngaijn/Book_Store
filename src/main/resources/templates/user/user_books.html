<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>My Books</title>
</head>
<body>
    <h1>My Books</h1>
    
    <div th:if="${user}">
        <h2>User Information</h2>
        <table border="1">
            <tr>
                <th>Username</th>
                <td th:text="${user}"></td>
            </tr>
        </table>
        
        <h2>My Books</h2>
        <div th:if="${#sets.isEmpty(books)}">
            <p>You don't have any books yet.</p>
        </div>
        <div th:unless="${#sets.isEmpty(books)}">
            <table border="1">
                <thead>
                    <tr>
                        <th>Book ID</th>
                        <th>Subject</th>
                        <th>Author</th>
                        <th>Publisher</th>
                        <th>Category</th>
                        <th>Price</th>
                        <th>Created Date</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="book : ${books}">
                        <td th:text="${book.id}"></td>
                        <td th:text="${book.subject}"></td>
                        <td th:text="${book.author}"></td>
                        <td th:text="${book.publisher}"></td>
                        <td th:text="${book.category}"></td>
                        <td th:text="${book.price}"></td>
                        <td th:text="${book.createdDate}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    
    <div th:unless="${user}">
        <p>User not found.</p>
    </div>
    
    <br>
    <a href="/book/list">View All Books</a>
    <br>
    <a href="/home">Back to Home</a>
</body>
</html>
