<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Moderator Portal</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .form-container { max-width: 400px; margin: 0 auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; }
        .error { color: red; }
    </style>

    <script>
        async function handleRegister(event) {
            event.preventDefault();
            // Collect form data
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            // POST to your registration API
            const response = await fetch("/moderator/register", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({ username, password })
            });

            if(response.ok) {
                const data = await response.json();
                console.log(data);
                alert(data.message);
                window.location.href = "/login.html"; // Optional: redirect to login page
            } else {
                const data = await response.json();
                console.log(data);
                alert("Registration failed: " + data.message);
            }
        }
    </script>
</head>
<body>
    <div class="form-container">
        <h2>Register New Moderator</h2>
        <form method="post" onsubmit="handleRegister(event)">
            <input type="text" id="username" name="username" placeholder="Username" required minlength="3"/>
            <input type="password" id="password" name="password" placeholder="Password" required minlength="6"/>
            <button type="submit">Register</button>
        </form>
        <p><a th:href="@{/login}">Already have an account? Login here</a></p>
    </div>
</body>
</html>
