<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - Moderator Portal</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .form-container { max-width: 400px; margin: 0 auto; }
        input { width: 100%; padding: 10px; margin: 10px 0; }
        button { width: 100%; padding: 10px; background: #28a745; color: white; border: none; }
        .error { color: red; }
    </style>
</head>
<body>
    <div class="form-container">
        <h2>Register New Moderator</h2>
        <form th:action="@{/register}" method="post">
            <input type="text" name="username" placeholder="Username" required minlength="3"/>
            <input type="password" name="password" placeholder="Password" required minlength="6"/>
            <button type="submit">Register</button>
            <div th:if="${error}" class="error" th:text="${error}"></div>
        </form>
        <p><a th:href="@{/login}">Already have an account? Login here</a></p>
    </div>
</body>
</html>
